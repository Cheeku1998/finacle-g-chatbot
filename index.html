<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Finacle Google Chatbot
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>
            Finacle Assistant
        </h1>

        <div id="chat-box"></div>

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Ask Finacle questions..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

            <button onclick="startVoice()">
                🎤
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
